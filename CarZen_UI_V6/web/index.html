<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the value of `flutter build web --base-href`. It must start
    and end with "/". Use it when the app is not served from the site root.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Buy and sell checked used cars, check what your car is worth, and book workshop services with CarZen.">
  <meta name="theme-color" content="#0F1C2E">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CarZen">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>CarZen - Buy, sell and service cars</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F2F4F7; }
    #cz-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #F2F4F7; transition: opacity .25s ease;
      font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #4A5A70;
    }
    #cz-splash.done { opacity: 0; pointer-events: none; }
    #cz-splash svg { width: 64px; height: 64px; }
    #cz-splash .bar { width: 120px; height: 3px; border-radius: 3px; background: #DCE2EA; overflow: hidden; }
    #cz-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #0F1C2E; border-radius: 3px;
      animation: cz-slide 1.1s ease-in-out infinite;
    }
    @keyframes cz-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #cz-splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="cz-splash" role="status" aria-live="polite">
    <svg viewBox="0 0 1 1" aria-hidden="true">
      <rect width="1" height="1" rx="0.26" fill="#0F1C2E"/>
      <path d="M0.16 0.47 C0.26 0.30 0.40 0.22 0.55 0.23 C0.70 0.24 0.79 0.33 0.86 0.45" fill="none" stroke="#4CC3F0" stroke-width="0.065" stroke-linecap="round"/>
      <path d="M0.4256 0.7556 A0.15 0.15 0 1 1 0.4256 0.5244" fill="none" stroke="#fff" stroke-width="0.09" stroke-linecap="round"/>
      <path d="M0.55 0.51 L0.80 0.51 L0.55 0.78 L0.81 0.78" fill="none" stroke="#fff" stroke-width="0.09" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="bar"></div>
    <span>Loading CarZen</span>
  </div>
  <noscript>CarZen needs JavaScript to run.</noscript>

  <!-- Razorpay Checkout (web payments). -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

  <script>
    // Hide the splash once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('cz-splash');
      if (!s) return;
      s.classList.add('done');
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
